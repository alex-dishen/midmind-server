services:
  midmind-postgres:
    image: postgres:17.5
    container_name: midmind-postgres
    restart: always
    shm_size: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: midmind
    ports:
      - '55001:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c log_statement=all
               -c log_connections=on
               -c log_disconnections=on
               -c log_hostname=on
               -c log_line_prefix='%t [%p] [%d] [%u] [%h] '

  redis:
    image: redis:8.0
    container_name: midmind-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/var/redis/data
    command: redis-server --loglevel notice --logfile ""

volumes:
  postgres_data:
  redis-data:
